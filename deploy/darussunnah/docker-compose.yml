services:
  darussunnah-frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    container_name: darussunnah-frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://darussunnahparung.com/api
      # Server-side only. Used by the audit route to verify the session
      # against the backend over the internal network, bypassing the edge.
      INTERNAL_API_URL: http://darussunnah-backend:8080/api
    expose:
      - "3000"
    healthcheck:
      # 127.0.0.1, bukan "localhost": di image standalone `localhost` resolve ke
      # ::1 dulu, sementara server hanya listen di IPv4, jadi healthcheck gagal
      # padahal aplikasinya sehat.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      app-network:
        ipv4_address: 172.19.0.11

  darussunnah-backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: darussunnah-backend
    restart: always
    environment:
      APP_URL: https://darussunnahparung.com
      API_PORT: "8080"
      ALLOWED_ORIGINS: https://darussunnahparung.com,https://www.darussunnahparung.com
      DB_PATH: /data/darussunnah.db
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "true"
      DEV_MODE: "false"
      ENVIRONMENT: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-mock_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-}
      FONNTE_API_URL: ${FONNTE_API_URL:-https://api.fonnte.com/send}
      FONNTE_API_KEY: ${FONNTE_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: info
      TZ: Asia/Bangkok
    volumes:
      - ./data:/data
      - ./data/uploads:/app/apps/backend/public/uploads
      # Student documents (KK, akta kelahiran, ijazah) are never served by the
      # public /uploads/ static file server. They live here and are only
      # reachable through the authenticated GET /documents/{userID}/{filename}.
      - ./data/private-uploads:/app/apps/backend/private/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/settings/public"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      app-network:
        ipv4_address: 172.19.0.3

networks:
  app-network:
    external: true
    name: my-docker-apps_app-network
